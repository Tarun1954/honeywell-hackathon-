[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-loop-building-agents"
version = "0.1.0"
description = "Closed-loop EnergyPlus control proof of concept"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.8",
    "mcp==1.28.1",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.2",
]

[tool.setuptools]
packages = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-loop-building-agents"
version = "0.1.0"
description = "Closed-loop EnergyPlus control proof of concept"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools]
packages = ["src"]
